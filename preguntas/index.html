<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    
    <title>Villaser - Banco de Examen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        
        <!-- BOTÓN VOLVER AL MENÚ -->
        <nav class="top-nav">
            <button class="btn-back" onclick="window.location.href='../index.html'" aria-label="Volver al menú principal">
                <span>⬅</span> Menú
            </button>
        </nav>

        <div id="status" aria-live="polite">⚡ SIMULADOR DE EXAMEN</div>
        
        <!-- SECCIÓN ESTADÍSTICAS -->
        <section id="section-stats" class="card">
            <h4>Ley 10281 & Normas AEA</h4>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;">
                <div>
                    <label for="total-questions-count">Base Total</label>
                    <input type="text" id="total-questions-count" readonly value="0" style="text-align: center; color: var(--accent); font-weight: bold;">
                </div>
                <div>
                    <label for="remaining-count">Restantes</label>
                    <input type="text" id="remaining-count" readonly value="0" style="text-align: center; color: var(--success); font-weight: bold;">
                </div>
            </div>
        </section>

        <!-- SECCIÓN RESULTADOS (Oculta por defecto) -->
        <div id="score-banner" class="capture-area hidden" style="margin-bottom: 15px; text-align: center;">
            <header class="list-header-title">RESULTADO DE LA TANDA</header>
            <div id="score-text" style="font-size: 2.5rem; font-weight: bold; color: var(--accent); margin: 10px 0;">0 / 10</div>
            <div id="score-feedback" style="font-size: 0.9rem; line-height: 1.4; color: var(--text); opacity: 0.9;"></div>
        </div>

        <!-- SECCIÓN PRINCIPAL (CUESTIONARIO) -->
        <section id="main-content">
            <form id="quiz-form">
                <div id="questions-container"></div>
                
                <!-- CONTROLES INFERIORES -->
                <div class="btn-grid-actions-footer" style="margin-top: 20px;">
                    <button type="button" id="btn-submit" class="btn-add-custom btn-full btn-wsp" onclick="evaluateQuiz()">📊 EVALUAR RESPUESTAS</button>
                    <button type="button" id="btn-next" class="btn-add-custom btn-full btn-cap hidden" onclick="nextRound()">🔄 SIGUIENTE TANDA DE 10</button>
                    <button type="button" class="btn-add-custom btn-full btn-export" onclick="resetHistory()" style="margin-top: -10px;">🧹 REINICIAR HISTORIAL</button>
                </div>
            </form>
        </section>
        
    </main>
    <script src="script.js"></script>
</body>
</html>
