<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    
    <title>Villaser - Materiales GNC</title>
    
    <!-- Librería para capturar pantalla -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        
        <!-- BOTÓN VOLVER AL MENÚ -->
        <nav class="top-nav">
            <button class="btn-back" onclick="window.location.href='../index.html'" aria-label="Volver al menú principal">
                <span>⬅</span> Menú
            </button>
        </nav>

        <div id="status" aria-live="polite">📡 SINCRONIZANDO...</div>
        
        <!-- SECCIÓN CLIENTE -->
        <section id="section-client" class="card">
            <h4>Cliente</h4>
            
            <label for="selCliente" class="sr-only">Seleccionar Cliente</label>
            <select id="selCliente" class="native-select">
                <option value="">Cargando...</option>
            </select>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;">
                <div>
                    <label for="cliTel" class="sr-only">Teléfono</label>
                    <input type="text" id="cliTel" readonly placeholder="Tel">
                </div>
                <div>
                    <label for="cliDir" class="sr-only">Dirección</label>
                    <input type="text" id="cliDir" readonly placeholder="Dir">
                </div>
            </div>
            
            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <div style="flex:1; width: 0; min-width: 50%;">
                    <label for="cliObs" class="sr-only">Observaciones Cliente</label>
                    <input type="text" id="cliObs" readonly placeholder="Obs">
                </div>
                <button id="btnCli" class="btn-add-custom btn-client" onclick="addClientToList()">Cargar</button>
            </div>
        </section>

        <!-- SECCIÓN PRINCIPAL -->
        <section id="main-content" class="hidden">
            
            <div class="card">
                <label for="obsGenerales">Nota Rápida:</label>
                <div style="display: flex; gap: 8px;">
                    <textarea id="obsGenerales" placeholder="Nota global..." style="flex:1; width: 0;"></textarea>
                    <button id="btnGen" class="btn-add-custom btn-general" onclick="addGeneralObs()">OK</button>
                </div>
            </div>

            <div class="card">
                <h4>Materiales</h4>
                
                <label for="sel0" class="sr-only">Categoría Principal</label>
                <select id="sel0" class="native-select" disabled>
                    <option value="">-- Selección --</option>
                </select>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;">
                    <select id="sel1" class="native-select" disabled aria-label="Subcategoría 1"><option value="">-- Selección --</option></select>
                    <select id="sel2" class="native-select" disabled aria-label="Subcategoría 2"><option value="">-- Selección --</option></select>
                    <select id="sel3" class="native-select" disabled aria-label="Subcategoría 3"><option value="">-- Selección --</option></select>
                    <select id="sel4" class="native-select" disabled aria-label="Subcategoría 4"><option value="">-- Selección --</option></select>
                </div>
                
                <label for="sel5" class="sr-only">Atributo extra</label>
                <select id="sel5" class="native-select" style="margin-top:8px" disabled>
                    <option value="">-- Selección --</option>
                </select>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;">
                    <div>
                        <label for="cantidad">Cant:</label>
                        <div class="stepper">
                            <button type="button" class="btn-step" onclick="changeQty(-1)" aria-label="Disminuir">-</button>
                            <input type="number" id="cantidad" value="1" min="1">
                            <button type="button" class="btn-step" onclick="changeQty(1)" aria-label="Aumentar">+</button>
                        </div>
                    </div>
                    <div>
                        <label>Unidad:</label>
                        <div class="unit-toggle">
                            <input type="radio" id="u_unid" name="um" value="Unidades" checked style="display:none">
                            <label for="u_unid">UNID</label>
                            <input type="radio" id="u_metros" name="um" value="Metros" style="display:none">
                            <label for="u_metros">MTS</label>
                        </div>
                    </div>
                </div>
                
                <label for="observaciones" class="sr-only">Notas del ítem</label>
                <textarea id="observaciones" placeholder="Notas del ítem..."></textarea>
                <button id="btnMat" class="btn-add-custom btn-material" style="width:100%; margin-top:10px" onclick="addItem()">Agregar Ítem</button>
            </div>

            <!-- ÁREA DE CAPTURA -->
            <div id="captureSection" class="capture-area">
                <header class="list-header-title">VILLASER - MATERIALES</header>
                <div id="itemsContainer"></div>
            </div>

            <!-- CONTROLES INFERIORES -->
            <div class="btn-grid-actions">
                <button id="btnCopyTitle" class="btn-add-custom btn-copy" onclick="copyTitle()">📋 TITULO</button>
                <button class="btn-add-custom btn-cap" onclick="takeScreenshot()">📸 CAPTURA</button>
                <button id="btnExport" class="btn-add-custom btn-export" onclick="exportToTxt()">💾 EXPORTAR</button>
                <button id="btnImport" class="btn-add-custom btn-import" onclick="document.getElementById('fileInput').click()">📂 IMPORTAR</button>
                <input type="file" id="fileInput" accept=".txt" style="display:none" onchange="importFromTxt(event)">
                <button class="btn-add-custom btn-full btn-wsp" onclick="sendWSP()">🚀 ENVIAR WHATSAPP</button>
            </div>
            
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
