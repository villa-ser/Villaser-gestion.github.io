<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    
    <title>Villaser - Informe Técnico</title>
    
    <!-- Librerías para capturar pantalla y generar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        
        <!-- BOTÓN VOLVER AL MENÚ -->
        <nav class="top-nav">
            <button class="btn-back" onclick="window.location.href='../index.html'" aria-label="Volver al menú principal">
                <span>⬅</span> Menú
            </button>
        </nav>

        <div id="status" aria-live="polite">📡 SINCRONIZANDO...</div>
        
        <!-- SECCIÓN CLIENTE -->
        <section id="section-client" class="card">
            <h4>Cliente</h4>
            
            <label for="selCliente" class="sr-only">Seleccionar Cliente</label>
            <select id="selCliente" class="native-select">
                <option value="">Cargando...</option>
            </select>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;">
                <div>
                    <label for="cliTel" class="sr-only">Teléfono</label>
                    <input type="text" id="cliTel" readonly placeholder="Tel">
                </div>
                <div>
                    <label for="cliDir" class="sr-only">Dirección</label>
                    <input type="text" id="cliDir" readonly placeholder="Dir">
                </div>
            </div>
            
            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <div style="flex:1; width: 0; min-width: 50%;">
                    <label for="cliObs" class="sr-only">Observaciones Cliente</label>
                    <input type="text" id="cliObs" readonly placeholder="Obs">
                </div>
                <button id="btnCli" class="btn-add-custom btn-client" onclick="addClientToList()">Cargar</button>
            </div>
        </section>

        <!-- SECCIÓN PRINCIPAL (INFORME TÉCNICO) -->
        <section id="main-content" class="hidden">
            
            <div class="card">
                <h4>Redacción de Informe Técnico</h4>
                <label for="textoInforme">Redactar párrafo:</label>
                <textarea id="textoInforme" placeholder="Escriba aquí el párrafo y presione agregar..." style="min-height: 100px; resize: vertical; line-height: 1.5;"></textarea>
                
                <button id="btnAgregarParrafo" class="btn-add-custom" style="width: 100%; margin-top: 10px; border-color: var(--success); color: var(--success); background: rgba(40, 167, 69, 0.1);" onclick="agregarParrafo()">+ AGREGAR PÁRRAFO AL INFORME</button>
                
                <!-- LISTA DE PÁRRAFOS EDITABLES -->
                <div id="lista-parrafos" style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px;"></div>
            </div>

            <!-- ÁREA DE CAPTURA (PARA IMAGEN / WSP) -->
            <div id="captureSection" class="capture-area">
                <header class="list-header-title">VILLASER - INFORME TÉCNICO</header>
                <div id="previewClientInfo" style="font-size: 0.85rem; margin-bottom: 12px; color: var(--accent); line-height: 1.4; border-bottom: 1px dashed rgba(255,255,255,0.15); padding-bottom: 8px;"></div>
                <div id="previewInforme" style="font-size: 0.9rem; white-space: normal; line-height: 1.5; padding: 4px;"></div>
            </div>

            <!-- CONTROLES INFERIORES -->
            <div class="action-grid" style="margin-top: 20px;">
                <button id="btnCopyTitle" class="btn-add-custom btn-copy" onclick="copyTitle()">📋 TÍTULO</button>
                <button class="btn-add-custom btn-cap" onclick="takeScreenshot()">📸 IMAGEN</button>
            </div>

            <div style="margin-top: 10px;">
                <button id="btnGenerarPDF" class="btn-add-custom btn-pdf" onclick="generarPDF()" style="width: 100%; height: 50px; font-size: 0.9rem;">📄 DESCARGAR PDF</button>
            </div>

            <div class="btn-grid-actions-footer">
                <button id="btnExport" class="btn-add-custom btn-export" onclick="exportToTxt()">💾 EXPORTAR</button>
                <button id="btnImport" class="btn-add-custom btn-import" onclick="document.getElementById('fileInput').click()">📂 IMPORTAR</button>
                <input type="file" id="fileInput" accept=".txt" style="display:none" onchange="importFromTxt(event)">
                <button class="btn-add-custom btn-full btn-wsp" onclick="sendWSP()">🚀 ENVIAR WHATSAPP</button>
            </div>
            
        </section>
    </main>

    <!-- PLANTILLA OCULTA EXCLUSIVA PARA EL PDF A4 (295mm) -->
    <div id="plantilla-pdf" style="display: none;">
        <div class="pdf-container">
            <header class="pdf-header">
                <!-- TÍTULO PRINCIPAL CENTRADO Y EN UN SOLO RENGLÓN -->
                <div style="text-align: center; margin-bottom: 20px; width: 100%;">
                    <h2 style="margin: 0; color: #0088aa; font-size: 22px; text-transform: uppercase;">Informe Técnico</h2>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: flex-start; width: 100%;">
                    <div class="pdf-info-box">
                        <div class="pdf-row"><b>Fecha</b> <span id="pdf-fecha"></span></div>
                        <div class="pdf-row"><b>Cliente</b> <span id="pdf-cliente"></span></div>
                        <div class="pdf-row"><b>Dirección</b> <span id="pdf-dir"></span></div>
                    </div>
                    <div class="pdf-logo-box">
                        <img src="membrete.avif" alt="Villaser Electricista" style="max-width: 100%; max-height: 70px; display: block; margin-left: auto;">
                    </div>
                </div>
            </header>

            <div class="pdf-body-content">
                <div id="pdf-texto-contenido" class="pdf-informe-texto"></div>
            </div>

            <footer class="pdf-footer">
                <div></div> 
                <div class="pdf-right-footer">
                    <div class="pdf-slogan">
                        ¡Electricidad Segura, Hogar Tranquilo!
                    </div>
                    <div class="pdf-contacto">
                        <span>📞 351 355 9347</span> &nbsp;|&nbsp; <span>🌐 villaser.com.ar</span>
                    </div>
                    <div class="pdf-contacto">
                        <span>🪪 Electricista Habilitado Cat III</span>
                    </div>
                    <div class="pdf-contacto">
                        <span>ERSeP Registro Nro 29029389 - 14027</span>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
