<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villaser - Planilla de Carga y Circuitos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout-wrapper">
        <main class="container">
            <nav class="top-nav">
                <button class="btn-back" onclick="window.location.href='../index.html'"><span>⬅</span> Menú</button>
            </nav>

            <div id="status" class="loading-state">📡 SINCRONIZANDO CLIENTES...</div>
            
            <section id="step-cliente" class="ngc-card" style="display: none;">
                <h4>Identificación de Proyecto</h4>
                <div class="row-group">
                    <select id="selCliente" class="native-select"><option value="">-- SELECCIONE CLIENTE --</option></select>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;">
                    <input type="text" id="cliTel" readonly placeholder="Teléfono">
                    <input type="text" id="cliDir" readonly placeholder="Dirección">
                </div>
                <!-- Botón corregido en tamaño -->
                <button id="btnLoadCli" class="btn-ngc" style="width: 100%; margin-top: 15px;" onclick="cargarCliente()">Cargar Proyecto</button>
            </section>

            <section id="step-trabajo" style="display:none; flex-direction: column; gap: 15px;">
                <div class="ngc-card">
                    <h4 id="titulo-form-ambiente">Carga de Ambientes y Bocas</h4>
                    <input type="hidden" id="editandoId" value="">
                    
                    <div class="row-group">
                        <select id="selAmbiente" class="native-select">
                            <option value="">-- Seleccione Ambiente / Carga --</option>
                            <option value="Sala de Estar">Sala de Estar</option>
                            <option value="Comedor">Comedor</option>
                            <option value="Living">Living</option>
                            <option value="Dormitorio">Dormitorio</option>
                            <option value="Cocina">Cocina</option>
                            <option value="Baño">Baño</option>
                            <option value="Toilette">Toilette</option>
                            <option value="Pasillo">Pasillo</option>
                            <option value="Lavadero">Lavadero</option>
                            <option value="Balcón (Semi)">Balcón (Semi-cubierto al 50%)</option>
                            <option value="Galería (Semi)">Galería (Semi-cubierta al 50%)</option>
                            <option value="Porche (Semi)">Porche (Semi-cubierto al 50%)</option>
                            <option value="Cochera (Semi)">Cochera (Semi-cubierta al 50%)</option>
                            <option value="Exterior">Exterior</option>
                            <option value="Aire Acondicionado">Aire Acondicionado (Carga)</option>
                            <option value="Motor / Bomba">Motor / Bomba (Carga)</option>
                        </select>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px;">
                        <input type="number" id="inputAncho" placeholder="Ancho (m)" step="0.01" min="0">
                        <input type="number" id="inputLargo" placeholder="Largo (m)" step="0.01" min="0">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; background: rgba(0,212,255,0.05); padding: 10px; border-radius: 8px;">
                        <div>
                            <label style="font-size:0.65rem; color:var(--ngc-primary);">Bocas Iluminación</label>
                            <input type="number" id="bocasIUG" placeholder="Cant." min="0" value="0">
                            <select id="circuitoIUG" class="native-select dynamic-circ-select" style="margin-top:5px; font-size:0.75rem; padding: 5px;"><option value="">-- Circuito --</option></select>
                        </div>
                        <div>
                            <label style="font-size:0.65rem; color:var(--ngc-primary);">Bocas Tomas</label>
                            <input type="number" id="bocasTUG" placeholder="Cant." min="0" value="0">
                            <select id="circuitoTUG" class="native-select dynamic-circ-select" style="margin-top:5px; font-size:0.75rem; padding: 5px;"><option value="">-- Circuito --</option></select>
                        </div>
                        <div>
                            <label style="font-size:0.65rem; color:var(--ngc-primary);">Bocas Específicas</label>
                            <input type="number" id="bocasESP" placeholder="Cant." min="0" value="0">
                            <select id="circuitoESP" class="native-select dynamic-circ-select" style="margin-top:5px; font-size:0.75rem; padding: 5px;"><option value="">-- Circuito --</option></select>
                            <input type="text" id="descESP" placeholder="Ej: AA" style="margin-top:5px; font-size:0.75rem; padding: 5px;">
                        </div>
                    </div>

                    <button id="btnGuardarAmbiente" class="btn-ngc" style="width: 100%;" onclick="guardarAmbiente()">➕ Agregar Ambiente</button>
                    <button id="btnCancelarEdicion" class="btn-ngc btn-danger" style="width: 100%; margin-top: 10px; display: none;" onclick="cancelarEdicion()">✕ Cancelar Edición</button>
                </div>

                <div id="zonaCaptura" class="capture-zone">
                    <header class="header-brand">PLANILLA DE CARGA Y CIRCUITOS</header>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1.5fr 1.5fr; gap: 5px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-bottom: 10px; align-items: center;">
                        <div><span style="font-size: 0.7rem; color: #aaa;">SLA:</span> <b id="ui-sla" style="color:var(--ngc-primary); display:block;">0.00 m²</b></div>
                        <div><span style="font-size: 0.7rem; color: #aaa;">Grado:</span> <b id="ui-grado" style="color:var(--ngc-warning); display:block;">MÍNIMO</b></div>
                        <div><span style="font-size: 0.7rem; color: #aaa;">DPMS Total:</span> <b id="ui-dpms" style="color:var(--ngc-primary); display:block;">0 VA</b></div>
                        <div>
                            <span style="font-size: 0.7rem; color: #aaa;">Suministro:</span>
                            <select id="selSuministro" class="native-select" style="font-size:0.75rem; padding: 2px; margin-top:2px;" onchange="renderTabla()">
                                <option value="MONOFÁSICO">MONOFÁSICO</option>
                                <option value="TRIFÁSICO">TRIFÁSICO</option>
                            </select>
                            <b id="ui-fase-alerta" style="font-size: 0.65rem; display:block; margin-top:2px;"></b>
                        </div>
                    </div>
                    
                    <div style="overflow-x: auto;">
                        <!-- Tabla optimizada para incluir CS al final -->
                        <table id="tablaMain" style="width: 100%; border-collapse: collapse; font-size: 0.75rem; text-align: center;">
                            <thead id="cabeceraTabla"></thead>
                            <tbody id="cuerpoTabla"></tbody>
                            <tfoot id="pieTabla" style="border-top: 2px solid rgba(255,255,255,0.2);"></tfoot>
                        </table>
                    </div>
                </div>

                <div class="ngc-card" style="border-color: var(--ngc-warning);">
                    <h4 style="color: var(--ngc-warning);">Gestión de Circuitos Extra</h4>
                    <div id="listaConfigCircuitos" style="display: flex; flex-direction: column; gap: 8px;"></div>
                    <button class="btn-ngc" style="width: 100%; margin-top: 10px; border-color: #888; color: #ccc;" onclick="agregarCircuitoManual()">+ Añadir Circuito Extra</button>
                </div>

                <button class="btn-ngc btn-pdf" onclick="generarPDF()" style="width: 100%;">📄 Descargar PDF</button>
            </section>
        </main>

        <aside class="preview-panel">
            <div id="plantilla-pdf">
                <div class="pdf-container">
                    <header class="pdf-header">
                        <div class="pdf-info-box">
                            <!-- Título centrado en una sola línea -->
                            <div class="pdf-row" style="text-align: center; font-size: 16px; margin-bottom: 10px; color:#0088aa; width: 100%;"><b>PLANILLA DE CARGA Y CIRCUITOS</b></div>
                            <div class="pdf-row"><b>Cliente:</b> <span id="pdf-cliente"></span></div>
                            <div class="pdf-row"><b>Fecha:</b> <span id="pdf-fecha"></span></div>
                        </div>
                    </header>
                    <table class="pdf-table" style="text-align: center;">
                        <thead id="pdf-thead"></thead>
                        <tbody id="pdf-tbody"></tbody>
                        <tfoot id="pdf-tfoot" style="font-weight: bold; background: #f0f0f0;"></tfoot>
                    </table>
                    <table class="pdf-table" style="text-align: center; margin-top: 20px; width: 60%;">
                        <tbody>
                            <tr><td style="text-align:left; font-weight:bold;">SLA</td><td id="pdf-sla-val" style="color:#0088aa; font-weight:bold;">0.00 m²</td></tr>
                            <tr><td style="text-align:left; font-weight:bold;">Grado AEA</td><td id="pdf-grado-val" style="color:#0088aa; font-weight:bold;">MÍNIMO</td></tr>
                            <tr><td style="text-align:left; font-weight:bold;">DPMS Total</td><td id="pdf-dpms-val" style="color:#0088aa; font-weight:bold;">0 VA</td></tr>
                            <tr><td style="text-align:left; font-weight:bold;">Suministro</td><td id="pdf-sum-val" style="color:#0088aa; font-weight:bold;">-</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </aside>
    </div>
    <script src="script.js"></script>
</body>
</html>
