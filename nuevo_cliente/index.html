<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121212">
    
    <title>Registro de Cliente - Villaser</title>
    
    <!-- Conexión con el archivo de estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ngc-form-container">
    
    <!-- BOTÓN VOLVER AL MENÚ -->
    <div class="top-nav">
        <button class="btn-back" onclick="window.location.href='../index.html'">
            <span>⬅</span> Volver al Menú
        </button>
    </div>

    <!-- Iframe oculto para evitar redirección de Google Forms -->
    <iframe name="hidden_confirm" id="hidden_confirm" style="display:none;" onload="if(submitted){showSuccess();}"></iframe>

    <form id="myForm" 
          action="https://docs.google.com/forms/d/e/1FAIpQLSd3pNf1SvYgKIlSCr8cWvJiP9WI_hgVpmqys8ZmU1iW_kmLbA/formResponse" 
          method="POST" 
          target="hidden_confirm" 
          onsubmit="return validarFormulario();">

        <div class="field-group">
            <label>Nombre y Apellido</label>
            <input type="text" name="entry.824784856" placeholder="Nombre completo del cliente..." required>
        </div>

        <div class="field-group">
            <label>Teléfono (10 dígitos)</label>
            <input type="tel" id="tel_field" name="entry.1169656179" placeholder="Ej: 3512345678" required maxlength="10">
        </div>

        <div class="field-group">
            <div class="label-container">
                <label>Dirección</label>
                <div class="btn-group-mini">
                    <button type="button" class="btn-ngc-mini" onclick="procesarDireccion()">Procesar</button>
                    <button type="button" class="btn-ngc-mini" onclick="borrarDireccion()">Borrar</button>
                    <button type="button" class="btn-ngc-mini" onclick="buscarEnMaps()">Maps</button>
                </div>
            </div>
            <textarea id="direccion_field" name="entry.1962624102" placeholder="Pegue la URL de Maps aquí y toque Procesar..." required></textarea>
        </div>

        <button type="submit" id="btnSubmit">Guardar en Sistema</button>
    </form>

    <!-- Pantalla de Éxito -->
    <div id="success-message">
        <div class="success-icon">✓</div>
        <div class="success-title">SINCRO EXITOSA</div>
        <p class="success-text">La planilla de Google ha sido actualizada correctamente.</p>
        <button class="btn-reset" onclick="resetForm()">Nueva carga</button>
    </div>
</div>

<!-- Conexión con el archivo de funciones JavaScript -->
<script src="script.js"></script>

</body>
</html>
