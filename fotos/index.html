<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    
    <title>Villaser - Informe Fotográfico</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
    
    <nav class="top-nav">
        <button class="btn-back" onclick="window.location.href='../index.html'" aria-label="Volver al menú principal">
            <span>⬅</span> Menú
        </button>
    </nav>

    <div id="loading" id="status" aria-live="polite" style="color: var(--accent); font-size: 0.8rem; text-align: center; margin-bottom: 10px; font-weight: 600;">
        📡 SINCRONIZANDO CLIENTES...
    </div>

    <!-- Overlay de carga global -->
    <div id="loadingOverlay" class="loading-overlay" style="display:none;">
        <div class="loading-state">
            📸 PROCESANDO...<br><small>Por favor espere</small>
        </div>
    </div>
    
    <!-- VISOR DE CÁMARA INTERNO CUADRADO -->
    <div id="cameraModal" class="camera-modal" style="display: none;">
        <div class="camera-header">
            <span>📸 Visor Villaser (1:1)</span>
            <button class="btn-close-camera" onclick="cerrarVisor()">✖ Cancelar</button>
        </div>
        <div class="video-container">
            <div class="video-square">
                <video id="videoElement" autoplay playsinline></video>
            </div>
        </div>
        <div class="camera-footer">
            <span id="camaraContador" style="color: #ffc107; font-weight: bold; margin-bottom: 10px; display: block; text-align: center;">0/3 fotos</span>
            <button id="btnCapturarVisor" class="btn-add-custom" style="width: 100%; border-color: var(--accent); background: rgba(0,212,255,0.1); font-size: 1.2rem; height: 55px;" onclick="tomarCapturaVisor()">
                ⭕ CAPTURAR FOTO
            </button>
        </div>
    </div>

    <div id="app" style="display:none;">
        
        <!-- PASO 1: SELECCIÓN DEL CLIENTE -->
        <section id="step-cliente" class="card">
            <h4>Identificación Cliente</h4>
            
            <label for="selCliente" class="sr-only">Seleccionar Cliente</label>
            <select id="selCliente" class="native-select" aria-label="Lista de clientes">
                <option value="">-- SELECCIONE CLIENTE --</option>
            </select>
            
            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <div style="flex:1; width: 0; min-width: 50%;">
                    <label for="cliInfo" class="sr-only">Información del cliente</label>
                    <textarea id="cliInfo" readonly placeholder="Info cliente..." style="height: 48px; min-height: 48px; resize: none; overflow: hidden; padding-top: 14px;"></textarea>
                </div>
                <button id="btnLoadCli" class="btn-add-custom btn-client" onclick="iniciarReporte()">Cargar</button>
            </div>

            <div style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
                <button class="btn-add-custom btn-import" style="width: 100%;" onclick="document.getElementById('fileImport').click()">
                    📂 CARGAR AVANCE GUARDADO
                </button>
            </div>
        </section>

        <!-- PASO 2: CONFIGURACIÓN DE TOMA Y GALERÍA -->
        <section id="step-fotos" style="display:none; flex-direction: column; gap: 15px;">

            <div class="card">
                <h4>
                    Datos de la Toma
                    <span id="clienteLabel" style="float: right; color: var(--text); opacity: 0.6; font-size: 0.75rem;"></span>
                </h4>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <div>
                        <label for="selHabitacion">Ambiente</label>
                        <select id="selHabitacion" class="native-select">
                            <option value="">-- SELECCIONE --</option>
                            <option value="Cocina">Cocina</option>
                            <option value="Comedor">Comedor</option>
                            <option value="Living">Living</option>
                            <option value="Dormitorio">Dormitorio</option>
                            <option value="Baño">Baño</option>
                            <option value="Pasillo">Pasillo</option>
                            <option value="Exterior / Patio">Exterior / Patio</option>
                            <option value="Fachada">Fachada</option>
                            <option value="General">General</option>
                        </select>
                    </div>
                    <div>
                        <label for="selBoca">Tipo Elemento</label>
                        <select id="selBoca" class="native-select">
                            <option value="">-- SELECCIONE --</option>
                            <option value="Tablero Principal (TP)">Tablero Principal (TP)</option>
                            <option value="Tablero Seccional (TS)">Tablero Seccional (TS)</option>
                            <option value="Tomacorriente">Tomacorriente</option>
                            <option value="Interruptor (Punto)">Interruptor (Punto)</option>
                            <option value="Boca de Iluminación">Boca de Iluminación</option>
                            <option value="Toma Especial (IUG/TUE)">Toma Especial (TUE)</option>
                            <option value="Puesta a Tierra (PAT)">Puesta a Tierra (PAT)</option>
                            <option value="Canalización">Canalización</option>
                            <option value="Cajas de Paso">Cajas de Paso</option>
                        </select>
                    </div>
                </div>

                <label for="selPared" style="margin-top: 10px;">Posición en el ambiente</label>
                <select id="selPared" class="native-select">
                    <option value="">-- SELECCIONE POSICIÓN --</option>
                    <option value="Izquierda">Izquierda</option>
                    <option value="Derecha">Derecha</option>
                    <option value="Frente">Frente</option>
                    <option value="Fondo">Fondo</option>
                    <option value="Abajo (Piso)">Abajo (Piso)</option>
                    <option value="Arriba (Techo)">Arriba (Techo)</option>
                </select>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;">
                    <div>
                        <label for="inpAltura">Altura (m)</label>
                        <input type="number" id="inpAltura" step="0.01" placeholder="Ej: 1.20">
                    </div>
                    <div>
                        <label for="inpDistancia">Distancia a pared (m)</label>
                        <input type="number" id="inpDistancia" step="0.01" placeholder="Ej: 0.50">
                    </div>
                </div>

                <label for="obsFoto" style="margin-top: 10px;">Observaciones</label>
                <textarea id="obsFoto" placeholder="Detalles de estado, cables, etc..."></textarea>

                <div style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <label style="margin:0;">Ingresar Imágenes (1:1)</label>
                        <span id="contadorLote" style="color: #ffc107; font-size: 0.8rem; font-weight: bold;">0/3 de este lote</span>
                    </div>

                    <input type="file" id="galleryInput" accept="image/*" multiple style="display: none;" onchange="procesarGaleria(event)">
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px;">
                        <button class="btn-add-custom" style="border-color: #28a745; color: #28a745;" onclick="iniciarCamaraVisor()">📸 CÁMARA</button>
                        <button class="btn-add-custom btn-copy" onclick="abrirGaleria()">🖼️ GALERÍA</button>
                    </div>

                    <button class="btn-add-custom btn-client" style="width: 100%;" onclick="prepararNuevaCarga()">🔄 NUEVA CARGA (Limpiar)</button>
                </div>
            </div>       
            
            <div class="card">
                <h4>
                    Listado de Entradas
                    <span id="contadorFotosTotal" style="float: right; color: var(--accent); font-weight: bold; font-size: 0.85rem;">0 fotos</span>
                </h4>
                <div id="galeriaFotos" class="galeria-list"></div>
            </div>
            
            <div style="margin-top: 10px;">
                <button id="btnGenerarPDF" class="btn-add-custom btn-pdf" onclick="generarPDFReporte()" style="width: 100%; height: 55px; font-size: 1rem;">📄 Generar Reporte PDF</button>
            </div>

            <!-- Botones de Guardado y Carga de Avance -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; padding-bottom: 30px;">
                <button class="btn-add-custom btn-export" onclick="exportarAvance()">💾 Guardar Avance</button>
                <button class="btn-add-custom btn-import" onclick="document.getElementById('fileImport').click()">📂 Cargar Avance</button>
            </div>
            
        </section>
    </div>
    
    <input type="file" id="fileImport" style="display:none" accept=".txt" onchange="importarAvance(event)">
    
    <!-- Imagen del membrete oculta para que el JS la pueda leer e insertar en el PDF -->
    <img id="imgMembrete" src="membrete.avif" alt="Membrete" style="display: none;" crossorigin="anonymous">

</main>
<script src="script.js"></script>
</body>
</html>
