<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    
    <title>Villaser - Reporte Fotográfico</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
    
    <nav class="top-nav">
        <button class="btn-back" onclick="window.location.href='../index.html'" aria-label="Volver al menú principal">
            <span>⬅</span> Menú
        </button>
    </nav>

    <!-- Indicadores de carga -->
    <div id="loading" aria-live="polite" class="loading-state">
        📡 SINCRONIZANDO CLIENTES NGC...
    </div>

    <div id="loadingOverlay" class="loading-overlay" style="display:none;">
        <div class="loading-state">
            📸 PROCESANDO IMAGEN...<br><small>Liberando memoria RAM</small>
        </div>
    </div>
    
    <div id="app" style="display:none;">
        
        <!-- PASO 1: SELECCIÓN DEL CLIENTE (Usa BD) -->
        <section id="step-cliente" class="ngc-card">
            <h4>Identificación Cliente</h4>
            
            <div class="row-group">
                <label for="selCliente">Seleccionar Cliente</label>
                <select id="selCliente" class="native-select" aria-label="Lista de clientes">
                    <option value="">-- SELECCIONE CLIENTE --</option>
                </select>
            </div>
            
            <div class="row-group-stretch" style="margin-top:10px;">
                <div class="flex-3">
                    <label for="cliInfo" class="sr-only">Información del cliente</label>
                    <textarea id="cliInfo" readonly placeholder="Info cliente..." style="height: 70px; resize: none; font-size: 0.85rem;"></textarea>
                </div>
                <div class="flex-btn-small">
                    <button id="btnLoadCli" class="btn-ngc btn-adapt" onclick="iniciarReporte()">Cargar</button>
                </div>
            </div>
        </section>

        <!-- PASO 2: CAPTURA Y GALERÍA -->
        <section id="step-fotos" style="display:none; flex-direction: column; gap: 15px;">

            <div class="ngc-card">
                <h4 style="display: flex; justify-content: space-between;">
                    <span>Datos de la Toma</span>
                    <span id="clienteLabel" style="color: var(--text-dim); font-size: 0.75rem;"></span>
                </h4>
                
                <div class="row-group-stretch">
                    <div class="flex-1">
                        <label for="selHabitacion">Ubicación</label>
                        <select id="selHabitacion" class="native-select">
                            <option value="">-- SELECCIONE --</option>
                            <option value="Cocina">Cocina</option>
                            <option value="Comedor">Comedor</option>
                            <option value="Living">Living</option>
                            <option value="Dormitorio">Dormitorio</option>
                            <option value="Baño">Baño</option>
                            <option value="Pasillo">Pasillo</option>
                            <option value="Exterior / Patio">Exterior / Patio</option>
                            <option value="Fachada">Fachada</option>
                            <option value="General">General</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label for="selBoca">Tipo de Elemento</label>
                        <select id="selBoca" class="native-select">
                            <option value="">-- SELECCIONE --</option>
                            <option value="Tablero Principal (TP)">Tablero Principal (TP)</option>
                            <option value="Tablero Seccional (TS)">Tablero Seccional (TS)</option>
                            <option value="Tomacorriente">Tomacorriente</option>
                            <option value="Interruptor (Punto)">Interruptor (Punto)</option>
                            <option value="Boca de Iluminación">Boca de Iluminación</option>
                            <option value="Toma Especial (IUG/TUE)">Toma Especial (TUE)</option>
                            <option value="Puesta a Tierra (PAT)">Puesta a Tierra (PAT)</option>
                            <option value="Canalización">Canalización</option>
                            <option value="Cajas de Paso">Cajas de Paso</option>
                        </select>
                    </div>
                </div>

                <div class="row-group">
                    <label for="obsFoto">Observaciones (Medidas, estado, etc.)</label>
                    <!-- Cuadro de texto más grande -->
                    <textarea id="obsFoto" placeholder="Ej: Altura 1.20m, medidas internas 3x3m..." style="height: 110px; resize: none;"></textarea>
                </div>

                <!-- Botones de Acción de Imagen -->
                <div style="margin-top: 15px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                        <label>Ingresar Imágenes</label>
                        <span id="contadorLote" style="color: var(--ngc-warning); font-size: 0.8rem; font-weight: bold;">0/3 de este lote</span>
                    </div>

                    <!-- Inputs Ocultos -->
                    <!-- capture="environment" fuerza abrir la cámara directo en móviles -->
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="procesarNuevasFotos(event)">
                    <!-- multiple permite elegir de la galería -->
                    <input type="file" id="galleryInput" accept="image/*" multiple style="display: none;" onchange="procesarNuevasFotos(event)">
                    
                    <div class="action-grid" style="margin-top: 0; margin-bottom: 15px; gap: 10px;">
                        <button class="btn-ngc btn-main" style="border-color: var(--ngc-success); color: var(--ngc-success);" onclick="abrirCamara()">
                            📸 CÁMARA
                        </button>
                        <button class="btn-ngc btn-main" style="border-color: var(--ngc-info); color: var(--ngc-info);" onclick="abrirGaleria()">
                            🖼️ GALERÍA
                        </button>
                    </div>

                    <button class="btn-ngc btn-main" style="width: 100%; border-color: var(--ngc-primary);" onclick="prepararNuevaCarga()">
                        🔄 NUEVA CARGA (Limpiar selectores)
                    </button>
                    <small style="color: var(--text-dim); display: block; margin-top: 8px; text-align: center;">El cliente se mantiene hasta generar el PDF.</small>
                </div>
            </div>       
            
            <div class="ngc-card">
                <h4 style="display: flex; justify-content: space-between; align-items: center;">
                    <span>Total del Informe</span>
                    <span id="contadorFotosTotal" style="color: var(--ngc-primary); font-weight: bold;">0 fotos</span>
                </h4>
                
                <div id="galeriaFotos" class="galeria-grid"></div>
            </div>
            
            <div style="margin-top: 10px; padding-bottom: 30px;">
                <button id="btnGenerarPDF" class="btn-ngc btn-main btn-pdf" onclick="generarPDFReporte()" style="width: 100%;">📄 Generar Reporte PDF</button>
            </div>
            
        </section>
    </div>
</main>
<script src="script.js"></script>
</body>
</html>
