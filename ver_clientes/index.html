<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    
    <title>Visor GNC Pro - Villaser</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="ngc-container">
    
    <!-- BOTÓN VOLVER AL MENÚ -->
    <nav class="top-nav">
        <button class="btn-back" onclick="window.location.href='../index.html'" aria-label="Volver al menú principal">
            <span>⬅</span> Menú
        </button>
    </nav>

    <div id="status-load" aria-live="polite">📡 SINCRONIZANDO...</div>
    <header class="header-title">Directorio Clientes</header>

    <div class="field-group">
        <label for="selCliente">Seleccionar Cliente</label>
        <select id="selCliente" class="native-select">
            <option value="">Cargando datos...</option>
        </select>
    </div>

    <div class="field-group">
        <label for="campoTel">Contacto</label>
        <div class="row-inline">
            <input type="text" id="campoTel" readonly placeholder="Teléfono...">
            <a id="btnCall" class="btn-ngc-side" aria-label="Llamar al cliente">Llamar</a>
            <a id="btnWts" class="btn-ngc-side btn-wsp" target="_blank" aria-label="Enviar WhatsApp">WSP</a>
        </div>
    </div>

    <div class="field-group">
        <label for="campoDir">Ubicación</label>
        <div class="row-inline">
            <input type="text" id="campoDir" readonly placeholder="Dirección...">
            <a id="btnMap" class="btn-ngc-side btn-maps" target="_blank" aria-label="Abrir en Google Maps">Maps</a>
        </div>
    </div>

    <div class="field-group">
        <label for="campoObs">Observaciones</label>
        <textarea id="campoObs" rows="4" readonly placeholder="Notas del cliente..."></textarea>
    </div>

    <button id="btnGenerar" class="btn-ngc-main" onclick="prepararFicha()">⚡ Generar Ficha de Texto</button>

    <section id="editor-section">
        <label for="editorTexto">Texto para Copiar (Editable)</label>
        <textarea id="editorTexto" rows="6" style="font-family: monospace; font-size: 0.85rem;"></textarea>
        <button id="btnCopy" class="btn-ngc-main btn-copy-final" onclick="copiarAlPortapapeles()">📋 Copiar Texto</button>
    </section>
</main>

<script src="script.js"></script>

</body>
</html>
